version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/docs/sphinx" # Location of package manifests
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    target-branch: "develop_deprecated"
    labels:
      - "documentation"
      - "dependencies"
      - "ci:docs-only"

  # ── GitHub Actions: keep workflow action versions current ──────────────────
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
